# Local dev infrastructure for Simuni's backend: Postgres+PostGIS, Redis,
# MinIO, and OSRM. Run from the backend/ folder:
#
#   docker compose up -d postgres redis minio
#   npm run prisma:migrate
#   npm run prisma:seed
#   npm run start:dev
#
# OSRM needs its own pre-processed map extract before `docker compose up
# osrm` will serve anything useful — see the "OSRM setup" note below the
# service definition. Skip it for local dev if you don't need turn-by-turn
# directions yet; routes.service.ts degrades gracefully (returns a 400 with
# a clear message) if OSRM isn't reachable.

version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: simuni
      POSTGRES_PASSWORD: simuni
      POSTGRES_DB: simuni
    ports:
      - "5432:5432"
    volumes:
      - simuni_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simuni"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - simuni_redis_data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - simuni_minio_data:/data

  # --- OSRM setup ------------------------------------------------------
  # OSRM serves routing from a pre-processed OpenStreetMap extract; it
  # can't route on raw .osm.pbf data. One-time setup (~10-30 min depending
  # on the extract size), run from an empty ./osrm-data folder:
  #
  #   mkdir -p osrm-data && cd osrm-data
  #   curl -O https://download.geofabrik.de/africa/ethiopia-latest.osm.pbf
  #   docker run -t -v "$PWD:/data" osrm/osrm-backend osrm-extract -p /opt/car.lua /data/ethiopia-latest.osm.pbf
  #   docker run -t -v "$PWD:/data" osrm/osrm-backend osrm-partition /data/ethiopia-latest.osrm
  #   docker run -t -v "$PWD:/data" osrm/osrm-backend osrm-customize /data/ethiopia-latest.osrm
  #
  # Then `docker compose up osrm` will serve it on :5000.
  osrm:
    image: osrm/osrm-backend:latest
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/ethiopia-latest.osrm
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data

volumes:
  simuni_postgres_data:
  simuni_redis_data:
  simuni_minio_data:
